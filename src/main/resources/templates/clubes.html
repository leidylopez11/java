<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clubes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 i { margin-right: 10px; color: #667eea; }
        .btn-volver {
            background: #6c757d;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
        }
        .btn-volver:hover { background: #5a6268; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 25px; margin-bottom: 30px; }
        .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 20px; font-weight: 600; }
        .card-header i { margin-right: 10px; }
        .card-body { padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; color: #555; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 10px; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-success { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; }
        .btn-warning { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .btn-danger { background: linear-gradient(135deg, #fa709a, #fee140); color: white; }
        .btn-info { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e0e0e0; }
        .badge { background: #e0e0e0; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .badge-info { background: #d1ecf1; color: #0c5460; }
        .badge-success { background: #d4edda; color: #155724; }
        .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
        .footer { text-align: center; padding: 20px; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-shield-alt"></i> Gestión de Clubes</h1>
            <a href="/" class="btn-volver"><i class="fas fa-arrow-left"></i> Volver al Inicio</a>
        </div>

        <!-- Formulario Club -->
        <div class="grid">
            <div class="card">
                <div class="card-header"><i class="fas fa-shield-alt"></i> <span th:text="${club != null and club.id != null} ? 'Editar Club' : 'Nuevo Club'">Nuevo Club</span></div>
                <div class="card-body">
                    <form th:action="${club != null and club.id != null} ? @{/clubes/actualizar/{id}(id=${club.id})} : @{/clubes/guardar}" method="post">
                        <div class="form-group"><label>Nombre:</label><input type="text" name="nombre" th:value="${club.nombre}" required/></div>
                        <div class="form-group"><label>Ciudad:</label><input type="text" name="ciudad" th:value="${club.ciudad}" required/></div>
                        <div class="form-group"><label>Año Fundación:</label><input type="number" name="anioFundacion" th:value="${club.anioFundacion}" required/></div>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                        <a th:if="${club != null and club.id != null}" href="/clubes" class="btn" style="background:#6c757d;color:white;">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>

        <!-- Lista de Clubes -->
        <div class="card">
            <div class="card-header"><i class="fas fa-list"></i> Lista de Clubes</div>
            <div class="card-body">
                <table>
                    <thead><tr><th>ID</th><th>Club</th><th>Ciudad</th><th>Año</th><th>Entrenador</th><th>Asociación</th><th>Jugadores</th><th>Competiciones</th><th>Acciones</th></tr></thead>
                    <tbody>
                        <tr th:each="c : ${clubes}">
                            <td><span class="badge" th:text="${c.id}">1</span></td>
                            <td><strong th:text="${c.nombre}"></strong></td>
                            <td th:text="${c.ciudad}"></td>
                            <td th:text="${c.anioFundacion}"></td>
                            <td><span th:if="${c.entrenador != null}" th:text="${c.entrenador.nombre} + ' ' + ${c.entrenador.apellido}"></span><span th:if="${c.entrenador == null}" class="badge">Sin entrenador</span></td>
                            <td><span th:if="${c.asociacion != null}" th:text="${c.asociacion.nombre}"></span><span th:if="${c.asociacion == null}" class="badge">Sin asociación</span></td>
                            <td><span class="badge badge-info" th:text="${#lists.size(c.jugadores)} + ' jugadores'">0</span></td>
                            <td><span class="badge badge-success" th:text="${#lists.size(c.competiciones)} + ' competiciones'">0</span></td>
                            <td class="acciones">
                                <a th:href="@{/clubes/ver/{id}(id=${c.id})}"><button class="btn btn-info btn-sm"><i class="fas fa-eye"></i> Ver</button></a>
                                <a th:href="@{/clubes/editar/{id}(id=${c.id})}"><button class="btn btn-warning btn-sm"><i class="fas fa-edit"></i> Editar</button></a>
                                <a th:href="@{/clubes/eliminar/{id}(id=${c.id})}" onclick="return confirm('¿Eliminar?')"><button class="btn btn-danger btn-sm"><i class="fas fa-trash"></i> Eliminar</button></a>
                            </td>
                        </tr>
                        <tr th:if="${clubes.empty}"><td colspan="9">No hay clubes registrados</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="footer"><a href="/h2-console" target="_blank" style="color:white;">🔍 Ver Base de Datos H2</a></div>
    </div>
</body>
</html>
